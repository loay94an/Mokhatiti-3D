name: Complete OpenPlan3D import
on:
  push:
    branches:
      - feat/openplan3d-import-arabic
    paths:
      - .github/workflows/import-openplan3d.yml
permissions:
  contents: write
concurrency:
  group: openplan3d-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: feat/openplan3d-import-arabic
          fetch-depth: 0
      - name: Import complete upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="771c9e1ad30bd1c3cc7584d6eca74deb2e14943d"
          git clone --filter=blob:none https://github.com/laanlabs/openPlan3D.git /tmp/openPlan3D
          git -C /tmp/openPlan3D checkout --detach "$upstream_sha"
          mkdir -p integrations/openPlan3D
          git -C /tmp/openPlan3D archive "$upstream_sha" | tar -x -C integrations/openPlan3D
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/openPlan3D
          if git diff --cached --quiet; then
            echo "No upstream files remain to import."
            exit 0
          fi
          git commit -m "Import complete OpenPlan3D upstream snapshot (batch two)"
          git push origin HEAD:feat/openplan3d-import-arabic
