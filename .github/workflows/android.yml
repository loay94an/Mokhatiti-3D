name: Native Android Quality Checks

on:
  push:
    branches: [main, native-engine-foundation, feat/native-sweethome3d-core-port]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, native-engine-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # During the completion phase CI runs tests only. APK packaging is deliberately
      # deferred until all implementation and acceptance gates in the roadmap pass.
      - name: Run JVM unit tests
        run: gradle --no-daemon clean testDebugUnitTest
