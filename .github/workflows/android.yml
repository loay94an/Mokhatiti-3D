name: Native Android APK

on:
  push:
    branches: [main, native-engine-foundation, feat/native-sweethome3d-core-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch on Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.loay94an.mokhatiti3d/.MainActivity
            sleep 8
            adb shell pidof com.loay94an.mokhatiti3d
            adb logcat -d -s AndroidRuntime:E > /tmp/mokhatiti-runtime.log
            if grep -q 'FATAL EXCEPTION' /tmp/mokhatiti-runtime.log; then
              cat /tmp/mokhatiti-runtime.log
              exit 1
            fi

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Mokhatiti-3D-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
