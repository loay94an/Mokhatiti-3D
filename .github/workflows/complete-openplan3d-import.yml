name: OpenPlan3D import and validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/openplan3d-import-arabic
    paths:
      - integrations/openPlan3D/IMPORT-AND-ARABIC-STATUS.md
      - integrations/openPlan3D/src/lib/i18n/**
      - integrations/openPlan3D/src/app.css

permissions:
  contents: write

concurrency:
  group: openplan3d-import-validation
  cancel-in-progress: false

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/openplan3d-import-arabic
          fetch-depth: 0
      - name: Import pinned upstream snapshot without replacing existing work
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="771c9e1ad30bd1c3cc7584d6eca74deb2e14943d"
          tmp="$(mktemp -d)"
          git clone --filter=blob:none https://github.com/laanlabs/openPlan3D.git "$tmp/upstream"
          git -C "$tmp/upstream" checkout --detach "$upstream_sha"
          mkdir -p "$tmp/snapshot" integrations/openPlan3D
          git -C "$tmp/upstream" archive "$upstream_sha" | tar -x -C "$tmp/snapshot"
          rsync -a --ignore-existing "$tmp/snapshot/" integrations/openPlan3D/
          rm -rf integrations/openPlan3D/.git
          test -f integrations/openPlan3D/package.json
          test -f integrations/openPlan3D/src/app.html
          imported_count="$(find integrations/openPlan3D -type f | wc -l)"
          echo "Integration file count: $imported_count"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/openPlan3D
          if ! git diff --cached --quiet; then
            git commit -m "Import remaining OpenPlan3D source snapshot"
            git push origin HEAD:feat/openplan3d-import-arabic
          fi
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/openPlan3D/package-lock.json
      - name: Install exact dependencies
        working-directory: integrations/openPlan3D
        run: npm ci
      - name: Type and Svelte checks
        working-directory: integrations/openPlan3D
        run: npm run check
      - name: Unit and regression tests
        working-directory: integrations/openPlan3D
        run: npm test
      - name: Production build
        working-directory: integrations/openPlan3D
        run: npm run build
