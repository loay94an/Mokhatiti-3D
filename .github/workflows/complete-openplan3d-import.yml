name: Complete OpenPlan3D source import

on:
  workflow_dispatch:
  push:
    branches:
      - feat/openplan3d-import-arabic
    paths:
      - integrations/openPlan3D/IMPORT-AND-ARABIC-STATUS.md

permissions:
  contents: write

concurrency:
  group: openplan3d-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/openplan3d-import-arabic
          fetch-depth: 0
      - name: Import pinned upstream snapshot without replacing existing work
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="771c9e1ad30bd1c3cc7584d6eca74deb2e14943d"
          tmp="$(mktemp -d)"
          git clone --filter=blob:none https://github.com/laanlabs/openPlan3D.git "$tmp/upstream"
          git -C "$tmp/upstream" checkout --detach "$upstream_sha"
          mkdir -p integrations/openPlan3D
          git -C "$tmp/upstream" archive "$upstream_sha" | tar -x -C "$tmp"
          rsync -a --ignore-existing "$tmp/" integrations/openPlan3D/
          # The temporary clone metadata is never part of the imported tree.
          rm -rf integrations/openPlan3D/.git
          test -f integrations/openPlan3D/package.json
          test -f integrations/openPlan3D/src/app.html
          count="$(find integrations/openPlan3D -type f | wc -l)"
          echo "Imported file count: $count"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/openPlan3D
          if git diff --cached --quiet; then
            echo "No additional upstream files to import."
            exit 0
          fi
          git commit -m "Import remaining OpenPlan3D source snapshot"
          git push origin HEAD:feat/openplan3d-import-arabic
